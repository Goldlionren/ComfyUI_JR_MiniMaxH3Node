[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-jr-minimax-h3-node"
version = "0.1.0"
description = "ComfyUI nodes for MiniMax H3 prompt, scaling, RTX and video workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["imageio-ffmpeg>=0.5"]

[project.urls]
Repository = "https://github.com/Goldlionren/ComfyUI_JR_MiniMaxH3Node"
Documentation = "https://github.com/Goldlionren/ComfyUI_JR_MiniMaxH3Node#readme"
Issues = "https://github.com/Goldlionren/ComfyUI_JR_MiniMaxH3Node/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
exclude = [".reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702"]
