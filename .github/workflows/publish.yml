name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: comfy-registry-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-node:
    name: Publish custom node
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check whether this version already exists
        id: registry-version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          node_id = metadata["project"]["name"]
          version = metadata["project"]["version"]
          escaped_node_id = urllib.parse.quote(node_id, safe="")
          escaped_version = urllib.parse.quote(version, safe="")
          url = f"https://api.comfy.org/nodes/{escaped_node_id}/versions/{escaped_version}"

          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  exists = response.status == 200
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  exists = False
              else:
                  raise

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"exists={'true' if exists else 'false'}\n")
          print(f"Registry preflight: {node_id} {version} exists={str(exists).lower()}")
          PY

      - name: Skip duplicate version
        if: steps.registry-version.outputs.exists == 'true'
        run: echo "The version in pyproject.toml is already published; skipping."

      - name: Publish custom node
        if: steps.registry-version.outputs.exists != 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: "true"
